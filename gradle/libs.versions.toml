[versions]
activity-compose = "1.12.1"
android-plugin = "8.13.1"
appcompat = "1.7.1"
constraintlayout = "2.2.1"
core-ktx = "1.17.0"
desugar = "2.1.5"
dexkit = "2.0.7"
hiddenapi = "4.4.0"
hiddenapibypass = "6.1"
jackson = "2.20.1"
jackson-annotations = "2.20"
#noinspection GradleDependency
jackson-compatible = "2.13.5"
kotlin = "2.2.21"
kotlinxCoroutinesCore = "1.10.2"
kotlinxSerializationJson = "1.9.0"
lifecycleLivedataKtx = "2.10.0" # This is defined but not used in the libraries below, androidx-lifecycle is used instead. You might want to clean this up later.
logback-android = "3.0.0"
lombok = "1.18.42"
material = "1.13.0"
mmkv = "2.3.0"
nanohttpd = "2.3.1"
okhttp = "5.3.2"
recyclerview = "1.4.0"
shizukuVersion = "13.1.5"
slf4j = "2.1.0-alpha1"
ui-tooling-preview-android = "1.10.0"
viewpager2 = "1.1.0"
webkit = "1.14.0"
xposed-api = "100"
xposed-service = "100-1.0.0"

# Versions for the second block of libraries
androidx-material3 = "1.2.0"
androidx-compose-ui = "1.6.7"
androidx-lifecycle = "2.8.0"


[libraries]
# AndroidX and Google Libraries
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
material = { module = "com.google.android.material:material", version.ref = "material" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesCore" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# Rikka / Shizuku
rikka-shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizukuVersion" }
rikka-shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizukuVersion" }
rikka-refine = { module = "dev.rikka.tools.refine:runtime", version.ref = "hiddenapi" }
rikka-hidden-stub = { module = "dev.rikka.hidden:stub", version.ref = "hiddenapi" }

# Logging
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-android = { module = "com.github.tony19:logback-android", version.ref = "logback-android" }

# Networking and JSON
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
#noinspection SimilarGradleDependency
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
#noinspection SimilarGradleDependency
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-annotations" }

# Other third-party libraries
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
dexkit = { module = "org.luckypray:dexkit", version.ref = "dexkit" }
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }

# Compose Related
ui-tooling-preview-android = { group = "androidx.compose.ui", name = "ui-tooling-preview-android", version.ref = "ui-tooling-preview-android" }
androidx-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidx-material3" }
androidx-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "androidx-compose-ui" }
androidx-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "androidx-compose-ui" }
androidx-runtime-livedata = { module = "androidx.compose.runtime:runtime-livedata", version.ref = "androidx-compose-ui" }

# Lifecycle Related
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "androidx-lifecycle" }


[plugins]
android-application = { id = "com.android.application", version.ref = "android-plugin" }
android-library = { id = "com.android.library", version.ref = "android-plugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
rikka-tools-refine = { id = "dev.rikka.tools.refine", version.ref = "hiddenapi" }