name: Android CI
run-name: 📦 ${{ github.actor }} Pack ${{ github.ref_name }} Sesame-TK CI

# 需要写权限以便创建 tag / push
permissions:
  contents: write

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 将时区设为亚洲/上海
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          echo "当前时间: $(date)"

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"
          cache: gradle

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-version: wrapper

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 使用 Gradle 构建
        run: ./gradlew assembleRelease -Pversion=${{ github.ref_name }}

      - name: 查找 APK 并设置输出
        id: locate_apks
        run: |
          # APKs现在位于release目录下，按架构命名
          release_dir="app/build/outputs/apk/release"
          arm64_apk=$(find "$release_dir" -name "*-arm64-v8a-*.apk" | head -n 1)
          armv7_apk=$(find "$release_dir" -name "*-armeabi-v7a-*.apk" | head -n 1)
          universal_apk=$(find "$release_dir" -name "*-universal-*.apk" | head -n 1)
          echo "arm64_apk=$arm64_apk" >> $GITHUB_OUTPUT
          echo "armv7_apk=$armv7_apk" >> $GITHUB_OUTPUT
          echo "universal_apk=$universal_apk" >> $GITHUB_OUTPUT

      - name: 将 APK 复制到暂存阶段以便签名
        run: |
          mkdir -p app/build/outputs/apk/all
          cp "${{ steps.locate_apks.outputs.arm64_apk }}" app/build/outputs/apk/all/
          cp "${{ steps.locate_apks.outputs.armv7_apk }}" app/build/outputs/apk/all/
          cp "${{ steps.locate_apks.outputs.universal_apk }}" app/build/outputs/apk/all/

      - name: 签名 APK 文件
        id: sign_apks
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: app/build/outputs/apk/all
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: 提取已签名 APK 路径
        id: extract_apks
        run: |
          # 匹配新的架构名称
          IFS=':' read -r -a files <<< "${{ steps.sign_apks.outputs.signedFiles }}"
          for file in "${files[@]}"; do
            if [[ "$file" == *arm64-v8a* ]]; then
              echo "signed_arm64=$file" >> $GITHUB_OUTPUT
            elif [[ "$file" == *armeabi-v7a* ]]; then
              echo "signed_armv7=$file" >> $GITHUB_OUTPUT
            elif [[ "$file" == *universal* ]]; then
              echo "signed_universal=$file" >> $GITHUB_OUTPUT
            fi
          done

      - name: 更新安装包 - arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a
          path: ${{ steps.extract_apks.outputs.signed_arm64 }}

      - name: 更新安装包 - armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: apk-armeabi-v7a
          path: ${{ steps.extract_apks.outputs.signed_armv7 }}

      - name: 更新安装包 - universal
        uses: actions/upload-artifact@v4
        with:
          name: apk-universal
          path: ${{ steps.extract_apks.outputs.signed_universal }}

      - name: 提取文件名
        id: extract_info
        run: |
          arm64_file=$(basename "${{ steps.extract_apks.outputs.signed_arm64 }}")
          armv7_file=$(basename "${{ steps.extract_apks.outputs.signed_armv7 }}")
          universal_file=$(basename "${{ steps.extract_apks.outputs.signed_universal }}")
          # 更新版本号提取逻辑
          version=$(echo "$arm64_file" | sed -E 's/.*-(arm64-v8a)-(v[^-]+).*-signed\.apk/\2/')
          echo "arm64_file=$arm64_file" >> $GITHUB_OUTPUT
          echo "armv7_file=$armv7_file" >> $GITHUB_OUTPUT
          echo "universal_file=$universal_file" >> $GITHUB_OUTPUT

      - name: 生成sha256校验值
        run: |
          # 更新Checksum文件名
          sha256sum ${{ steps.extract_apks.outputs.signed_arm64 }} > CHECKSUMS-Sesame-Y-arm64-v8a-${{ steps.extract_info.outputs.version }}.apk.sha256
          sha256sum ${{ steps.extract_apks.outputs.signed_armv7 }} > CHECKSUMS-Sesame-Y-armeabi-v7a-${{ steps.extract_info.outputs.version }}.apk.sha256
          sha256sum ${{ steps.extract_apks.outputs.signed_universal }} > CHECKSUMS-Sesame-Y-universal-${{ steps.extract_info.outputs.version }}.apk.sha256

      - name: 获取提交详细信息
        # if: startsWith(github.ref, 'refs/heads/main') && github.event_name == 'push'
        if: github.event_name == 'push'
        run: |
          VERSION_TAG="v${{ steps.extract_info.outputs.version }}"
          echo "Creating tag: $VERSION_TAG"
          git tag "$VERSION_TAG"
          git push origin "$VERSION_TAG"

      - name: 向TG发送组合消息（APK 和 说明）
        # if: github.ref == 'refs/heads/main'
        env:
          CHANNEL_ID: ${{ secrets.TG_CHAT_ID }}
          BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          ARM64_FILE: ${{ steps.extract_apks.outputs.signed_arm64 }}
          ARMV7_FILE: ${{ steps.extract_apks.outputs.signed_armv7 }}
          UNIVERSAL_FILE: ${{ steps.extract_apks.outputs.signed_universal }}
          COMMIT_MESSAGE: |+
            🚀 *Github 新版本发布！*         
            ```TXT
            ⚠️注意
            从官方或其他作者版本切换至此非官方版本时，请务必删除 `UID` 目录下的 `config_v2.json` 文件（无需删除整个 `TK` 文件夹），否则可能导致优先级设置不生效或运行错乱
            7点整到40分，这个时间段只能运行循环收能量，不干其他事

            📋更新日志：
            提升模块稳定性
            优化模块流畅性

            ${{ github.event.head_commit.message }}
            ```Branch: `${{ github.ref_name }}`
            *蹲点收能量版*
            📥 *下载说明:*
              <b>- arm64-v8a:</b> 适用于64位设备 (主流新设备)
              <b>- armeabi-v7a:</b> 适用于32位设备 (旧设备)
              <b>- universal:</b> 通用版，包含所有架构 (体积较大)
        run: |
          ESCAPED=$(python3 -c 'import json, os, urllib.parse; print(urllib.parse.quote(json.dumps(os.environ["COMMIT_MESSAGE"])))')

          # 【已修正】确保 media JSON 数组包含所有三个文件
          curl -v "https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup" \
          -F "chat_id=${CHANNEL_ID}" \
          -F "media=[{\"type\":\"document\",\"media\":\"attach://arm64.apk\",\"parse_mode\":\"HTML\",\"caption\":${ESCAPED}},{\"type\":\"document\",\"media\":\"attach://armv7.apk\"},{\"type\":\"document\",\"media\":\"attach://universal.apk\"}]" \
          -F "arm64.apk=@${ARM64_FILE}" \
          -F "armv7.apk=@${ARMV7_FILE}" \
          -F "universal.apk=@${UNIVERSAL_FILE}"
      

      - name: 将资源整合上传到仓库发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.extract_info.outputs.version }}
          # name: Sesame-TK-Y-${{ steps.extract_info.outputs.version }}-SNL # 发布的名称。默认为标签名称
          name: ${{ github.event.release.tag_name || steps.extract_info.outputs.version }}   # 发布的名称。默认为标签名称
          # 更新上传的文件列表和发布说明
          files: |
            ${{ steps.extract_apks.outputs.signed_arm64 }}
            ${{ steps.extract_apks.outputs.signed_armv7 }}
            ${{ steps.extract_apks.outputs.signed_universal }}
            CHECKSUMS-Sesame-TK-Y-arm64-v8a-${{ steps.extract_info.outputs.version }}.apk.sha256
            CHECKSUMS-Sesame-TK-Y-armeabi-v7a-${{ steps.extract_info.outputs.version }}.apk.sha256
            CHECKSUMS-Sesame-TK-Y-universal-${{ steps.extract_info.outputs.version }}.apk.sha256
          draft: false
          append_body: true
          generate_release_notes: true
          body: |
            ## ✨What's Changed

            ${{ steps.commit_details.outputs.COMMIT_MESSAGE_BODY }}
            > ## 下载说明
            > - **Sesame-TK-Y-arm64-v8a-...apk**: 适用于64位ARM设备 (主流新设备)。
            > - **Sesame-TK-Y-armeabi-v7a-...apk**: 适用于32位ARM设备 (旧设备)。
            > - **Sesame-TK-Y-universal-...apk**: 通用版，包含所有架构 (体积较大)。
            >
            > **如果不确定，请下载 `universal` 版本。**
